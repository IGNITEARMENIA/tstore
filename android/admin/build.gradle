plugins { id 'com.android.application' }
android {
    namespace 'am.ignite.tstore.admin'
    compileSdk 34
    defaultConfig {
        applicationId 'am.ignite.tstore.admin'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APK_VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('APK_VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('../app/tstore.keystore')
            storePassword 'tstore-ignite'
            keyAlias 'tstore'
            keyPassword 'tstore-ignite'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
