<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IGNITE Полёт</title>
<style>
:root{--bg:#f6f0e6;--card:#fffaf2;--ink:#2b2420;--muted:#8a7b6c;--beige:#d9c3a5;--pink:#ff2bd6;--pink2:#ff7ae8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1916;--card:#26211d;--ink:#f3ebe1;--muted:#a8998a;--beige:#5a4a3a}}
:root[data-theme="dark"]{--bg:#1d1916;--card:#26211d;--ink:#f3ebe1;--muted:#a8998a;--beige:#5a4a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.demo{max-width:640px;margin:0 auto;padding:40px 16px;text-align:center}
.logo{font-weight:800;font-size:28px;letter-spacing:2px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;display:inline-block;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--beige)}
.demo p{color:var(--muted);line-height:1.5}
.demo button.open{margin-top:12px;background:none;border:1px dashed var(--beige);color:var(--muted);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}

#ig-ov{position:fixed;inset:0;z-index:9999;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#ig-ov.on{display:block}
#ig-cv{display:block;width:100%;height:100%}
#ig-x{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer;z-index:3}
#ig-panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.78);z-index:2}
#ig-panel .box{max-width:340px;width:100%;text-align:center}
#ig-panel h2{margin:0 0 4px;font-size:34px;font-weight:900;letter-spacing:6px}
#ig-panel h2 span{color:var(--pink);text-shadow:0 0 12px var(--pink)}
#ig-panel .sk{width:96px;filter:drop-shadow(0 0 14px rgba(255,43,214,.7));margin-bottom:6px}
#ig-panel p{margin:8px 0;color:#d6d6d6;line-height:1.45;font-size:15px}
#ig-panel .big{font-size:58px;font-weight:900;margin:0;line-height:1}
#ig-panel .pct{font-size:44px;font-weight:900;color:var(--pink2);text-shadow:0 0 18px var(--pink);margin:6px 0 0}
#ig-panel .near{color:#fff;background:rgba(255,43,214,.15);border:1px solid var(--pink);border-radius:12px;padding:8px 10px;font-weight:700}
#ig-panel .code{display:inline-block;margin:6px 0;padding:9px 14px;border:1px dashed var(--pink);border-radius:10px;font:700 21px ui-monospace,Menlo,monospace;letter-spacing:2px}
#ig-panel .tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
#ig-panel .tiers div{border:1px solid #333;border-radius:10px;padding:7px 0;font-size:12px;color:#888}
#ig-panel .tiers div b{display:block;font-size:16px;color:#fff}
#ig-panel .tiers div.on{border-color:var(--pink);box-shadow:0 0 10px rgba(255,43,214,.5);color:#ffb3f0}
#ig-panel .btn{margin-top:12px;border:0;border-radius:14px;padding:14px 30px;font:800 17px inherit;font-family:inherit;color:#fff;background:var(--pink);box-shadow:0 0 18px var(--pink);cursor:pointer}
#ig-panel .btn2{margin-top:8px;border:1px solid #444;border-radius:12px;padding:9px 18px;background:#111;color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer}
#ig-panel small{display:block;color:#8d8d8d;font-size:12px;margin-top:10px;line-height:1.4}
#ig-panel .box{max-height:100%;overflow:auto}
.ig-f{display:flex;flex-direction:column;gap:10px;text-align:left;margin:12px 0}
.ig-f label{font-size:13px;color:#bbb}
.ig-f input[type=text],.ig-f input[type=tel]{width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1px solid #333;background:#0d0d0d;color:#fff;font:600 16px inherit;font-family:inherit;outline:none}
.ig-f input:focus{border-color:var(--pink);box-shadow:0 0 10px rgba(255,43,214,.4)}
.ig-f .ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#ccc;line-height:1.35}
.ig-f .ck input{margin-top:2px;accent-color:#ff2bd6;width:18px;height:18px;flex:none}
.ig-err{color:#ff7a9a;font-size:13px;min-height:16px;margin:0!important}
.ig-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.ig-tabs button{border:1px solid #333;background:#0d0d0d;color:#bbb;border-radius:10px;padding:8px 0;font:700 13px inherit;font-family:inherit;cursor:pointer}
.ig-tabs button.on{border-color:var(--pink);color:#fff;box-shadow:0 0 10px rgba(255,43,214,.45)}
.ig-lb{list-style:none;margin:0;padding:0;text-align:left}
.ig-lb li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #1d1d1d;font-size:15px}
.ig-lb li .n{width:26px;text-align:center;font-weight:900;color:#888}
.ig-lb li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-lb li .sc{font-weight:900}
.ig-lb li.m1 .n{color:#ffd76a}.ig-lb li.m2 .n{color:#e6e6e6}.ig-lb li.m3 .n{color:#d39a62}
.ig-lb li.me{background:rgba(255,43,214,.14);border:1px solid var(--pink);border-radius:10px}
.ig-lb li.gap{justify-content:center;color:#555;border:0;padding:2px}
.ig-me{margin:10px 0 0;font-size:14px;color:#ffb3f0;font-weight:700}
.ig-demo{display:inline-block;margin-bottom:6px;font-size:11px;color:#000;background:#ffd76a;border-radius:6px;padding:2px 8px;font-weight:800}
.ig-user{font-size:13px;color:#aaa;margin-top:4px}
.ig-user a{color:#ffb3f0;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

      ctx.fillStyle='#1a1206'; ctx.font='900 '+Math.round(7*S)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('GOLD',k.x,k.y); });
    // дым
    puffs.forEach(function(p){ ctx.globalAlpha=Math.max(0,p.l)*.35; ctx.fillStyle='#e9e9e9'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }); ctx.globalAlpha=1;
    // череп
    if(st!=='menu'){ var w=64*S, h=w*232/320, ang=Math.max(-.45,Math.min(.6,vy/(900*S)));
      ctx.save(); ctx.translate(BX(),y); ctx.rotate(st==='ready'?0:ang); ctx.shadowColor=rgba(gl,1); ctx.shadowBlur=18;
      if(sk.complete) ctx.drawImage(sk,-w/2,-h/2,w,h); ctx.restore(); }
    sparks.forEach(function(p){ ctx.globalAlpha=Math.max(0,p.l); ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4); }); ctx.globalAlpha=1;
    drawAngel(now);
    ctx.restore();
    if(flashT>0){ ctx.fillStyle='rgba(255,43,214,'+(flashT*.6)+')'; ctx.fillRect(0,0,W,H); }
    // HUD
    if(st==='play'||st==='ready'||st==='dead'){
      ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#fff'; ctx.shadowColor=rgba(gl,1); ctx.shadowBlur=14;
      ctx.font='900 '+Math.round(54*S)+'px sans-serif'; ctx.fillText(score,W/2,46*S); ctx.shadowBlur=0;
      ctx.font='700 '+Math.round(14*S)+'px sans-serif'; ctx.fillStyle='#ffb3f0';
      ctx.fillText(igtr('rec')+': '+Math.max(best(),score),W/2,108*S);
      if(god){ ctx.save(); ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='800 '+Math.round(13*S)+'px sans-serif'; ctx.fillText('∞',14,14); ctx.restore(); }
      if(st==='ready'){ ctx.fillStyle='#fff'; ctx.font='800 '+Math.round(18*S)+'px sans-serif'; ctx.fillText(igtr('tap'),W/2,H*.62); }
    }
    if(tierFlash&&tierFlash.t>0){ tierFlash.t-=1/60; ctx.save(); ctx.globalAlpha=Math.min(1,tierFlash.t); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#fff'; ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=24; ctx.font='900 '+Math.round(44*S)+'px sans-serif'; ctx.fillText('∞',W/2,H*.3);
      ctx.font='800 '+Math.round(14*S)+'px sans-serif'; ctx.shadowBlur=0; ctx.fillText(tierFlash.txt||'',W/2,H*.3+34*S); ctx.restore(); }
    if(banner&&st!=='menu'){ var bt=banner.t, al=Math.min(1,(2.4-bt)/.4,bt/.5); ctx.save(); ctx.globalAlpha=Math.max(0,al); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=rgba(gl,1); ctx.font='800 '+Math.round(12*S)+'px sans-serif'; ctx.fillText(igtr('world')+' '+banner.n,W/2,H*.84);
      ctx.fillStyle='#fff'; ctx.shadowColor=rgba(gl,1); ctx.shadowBlur=18; ctx.font='900 '+Math.round(26*S)+'px sans-serif'; ctx.fillText(banner.name,W/2,H*.84+26*S); ctx.restore(); }
  }

  function best(){ return load('ig-best',0)|0; }
  function wire(){ box.querySelectorAll('[data-go]').forEach(function(b){ b.onclick=begin; });
    box.querySelectorAll('[data-cat]').forEach(function(b){ b.onclick=function(){ toParent('igfly-cat'); }; }); }
  function show(h){ box.innerHTML=h; panel.style.display='flex'; wire(); }
  function menu(){ st='menu'; var bs=best();
    show('<img class="sk" alt="" src="'+SKULL+'"><h2>IGN<span>I</span>TE</h2>'+
      '<p>'+igtr('intro')+'</p><p style="font-size:13px">'+igtr('gold')+'</p>'+
      (bs?'<p class="ig-user">'+igtr('rec')+': <b style="color:#fff">'+bs+'</b></p>':'')+
      '<button class="btn" data-go>'+igtr('play')+'</button><small>'+igtr('help')+'</small>'); }
  function over(){ st='over'; var sc=score, bs=best(), rec=false;
    if(sc>bs&&!runGod){ save('ig-best',sc); bs=sc; rec=sc>0; }
    show('<h2>IGN<span>I</span>TE</h2><p class="big">'+sc+'</p>'+(rec?'<p class="pct">'+igtr('newrec')+'</p>':'')+
      '<p style="margin-top:2px">'+igtr('rec')+': '+bs+'</p>'+
      '<button class="btn" data-go>'+igtr('again')+'</button><br><button class="btn2" data-cat>'+igtr('cat')+'</button>'); }
  function toParent(m){ try{ if(window.parent&&window.parent!==window){ window.parent.postMessage(m,'*'); return true; } }catch(e){} return false; }
  // ---- ввод ----
  cv.addEventListener('pointerdown',function(e){ e.preventDefault(); flap(); });
  window.addEventListener('keydown',function(e){ if(!ov.classList.contains('on'))return;
    if(!(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))&&e.key&&e.key.length===1){ godSeq=(godSeq+e.key.toLowerCase()).slice(-6);
      if(godSeq==='ignite'){ god=!god; godSeq=''; tierFlash={p:0,t:1.4,txt:god?igtr('on'):igtr('off')}; } }
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.code==='Space'||e.key==='ArrowUp'){ e.preventDefault(); if(st==='over'||st==='menu') begin(); else if(st!=='menu') flap(); }
    if(e.key==='Escape') exitGame(); });

  function open(){ ov.classList.add('on'); document.body.style.overflow='hidden'; resize(); reset(); menu(); last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
  function close(){ cancelAnimationFrame(raf); ov.classList.remove('on'); document.body.style.overflow=''; panel.style.display='none'; st='menu'; }
  function exitGame(){ close(); if(!toParent('igfly-close')){ if(history.length>1) history.back(); else location.href='../'; } }
  $('#ig-x').onclick=exitGame;
  window.addEventListener('resize',function(){ if(ov.classList.contains('on')) resize(); });

  var taps=0, tt=0;
  function hook(el){ el.addEventListener('click',function(){ taps++; clearTimeout(tt); tt=setTimeout(function(){taps=0},1500); if(taps>=5){ taps=0; open(); } }); }
  var logo=document.getElementById('logo'); if(logo) hook(logo);
  window.IgniteFly={open:open,close:close,hook:hook,onCatalog:null};
  open();
})();
</script>
</body>
