name: Build Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Publish APK to the site
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/TStore.apk
          git config user.name "apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          git add apk/TStore.apk
          git commit -m "APK build ${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with: { name: TStore-apk, path: apk/TStore.apk }
